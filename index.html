<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bot-Terminal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#14212b;--mute:#667785;--line:#dde4e7;--up:#0c8f68;--down:#d2412f;--acc:#2f5bd8;--accbg:#e6ecfc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--card:#17252f;--ink:#e9eff3;--mute:#8fa2b0;--line:#253541;--up:#4fd1a5;--down:#ff8272;--acc:#7da2ff;--accbg:#1d2d4d}}
:root[data-theme="dark"]{--bg:#0f1a22;--card:#17252f;--ink:#e9eff3;--mute:#8fa2b0;--line:#253541;--up:#4fd1a5;--down:#ff8272;--acc:#7da2ff;--accbg:#1d2d4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mute)}
main{max-width:460px;margin:0 auto;padding:0 16px 40px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;font-weight:600;background:var(--acc);color:#fff}
button.ghost{background:var(--accbg);color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{display:flex;gap:6px;margin:4px 0 14px}
nav button{flex:1;background:transparent;color:var(--mute);padding:8px 4px;border-bottom:2px solid var(--line);border-radius:0}
nav button.on{color:var(--ink);border-color:var(--acc)}
.badge{background:var(--down);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{padding:18px 16px}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
h2{font-size:15px;font-weight:800;margin:0 0 6px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px}
.long{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.short{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-size:13px;margin:8px 0}
.lv small{display:block;color:var(--mute);font-size:11px}
input{font:inherit;width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}
.dot.on{background:var(--up)}
.empty{color:var(--mute);padding:6px 0}
</style>
</head>
<body>
<header>
  <div><h1>Bot-Terminal</h1><div class="sub">Übungsmodus mit virtuellen 10 €, kein echtes Geld</div></div>
  <button id="run">Bots starten</button>
</header>
<main>
  <nav id="tabs">
    <button data-v="v1" class="on">Übersicht</button>
    <button data-v="v2">Signale</button>
    <button data-v="v3">Mitteilungen<span id="bd" class="badge" hidden></span></button>
  </nav>

  <section id="v1">
    <div class="card hero">
      <div class="mute" style="font-size:13px">Gesamtwert</div>
      <div class="big" id="eq">10,00 €</div>
      <div id="pl" style="font-weight:600"></div>
      <svg id="spark" viewBox="0 0 300 50" preserveAspectRatio="none" style="width:100%;height:50px;margin-top:10px"></svg>
    </div>
    <div class="card"><h2>Kurse</h2><div id="prices"></div><div class="sub" id="src" style="margin-top:6px"></div></div>
    <div class="card"><h2>Deine Bots</h2><div id="bots"></div>
      <div style="display:flex;gap:8px;margin-top:10px"><input id="nb" placeholder="Name für neuen Bot" maxlength="24"><button class="ghost" id="addb">Hinzufügen</button></div>
    </div>
    <button class="ghost" id="reset" style="width:100%">Zurücksetzen</button>
  </section>

  <section id="v2" hidden>
    <div class="card"><h2>Offene Positionen</h2><div id="open"></div></div>
    <div class="card"><h2>Abgeschlossen</h2><div id="closed"></div></div>
  </section>

  <section id="v3" hidden>
    <div class="card"><div id="msgs"></div></div>
  </section>
</main>

<script>
const COINS=[{id:'bitcoin',s:'BTC',p:78000},{id:'ethereum',s:'ETH',p:2900},{id:'solana',s:'SOL',p:157},{id:'ripple',s:'XRP',p:2.1}];
const START=10,SIZE=3,MAXOPEN=3,SL=1,TP=2;
const KEY='cbt-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const j=localStorage.getItem(KEY);return j?JSON.parse(j):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const fresh=()=>({cash:START,pos:[],hist:[],msgs:[],bots:[],seen:[]});
let S=Object.assign(fresh(),load()||{});
const price={},px={},sen={},trend={},eqH=[],chg24={};
COINS.forEach(c=>{price[c.id]=c.p;px[c.id]=[c.p];sen[c.id]=0;trend[c.id]=0});
let live=false,running=false,n=0,unread=0,resetArm=false,tab='v1';

const eur=v=>v.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const pr=v=>{const d=v<10?4:v<1000?2:0;return v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d})+' €'};
const pc=v=>(v>=0?'+':'')+v.toFixed(2).replace('.',',')+' %';
const sym=id=>COINS.find(c=>c.id===id).s;
const now=()=>new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});

function say(title,text,u){S.msgs.unshift({t:now(),title,text,u});S.msgs=S.msgs.slice(0,40);if(tab!=='v3')unread++;save()}

async function fetchLive(){
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,ripple&vs_currencies=eur&include_24hr_change=true');
    const j=await r.json();
    if(!live)COINS.forEach(c=>{px[c.id]=[]});
    COINS.forEach(c=>{price[c.id]=j[c.id].eur;chg24[c.id]=j[c.id].eur_24h_change;px[c.id].push(price[c.id])});
    return true;
  }catch(e){return false}
}
function walk(){
  COINS.forEach(c=>{
    trend[c.id]=trend[c.id]*.9+(Math.random()-.5)*.0016;
    price[c.id]*=1+trend[c.id]+(Math.random()-.5)*.002;
    px[c.id].push(price[c.id]);
  });
}
const val=p=>{const cur=price[p.id];return p.size*(1+p.dir*(cur/p.entry-1))};
const equity=()=>S.cash+S.pos.reduce((a,p)=>a+val(p),0);

const NAMES={BTC:['btc','bitcoin'],ETH:['eth','ethereum','ether'],SOL:['sol','solana'],XRP:['xrp','ripple']};
const POS=['surge','rally','gain','soar','bull','approve','adopt','record','inflow','jump','rise','upgrade','partnership'];
const NEG=['drop','crash','plunge','bear','hack','ban','lawsuit','sell-off','selloff','fall','slump','outflow','exploit','fraud'];
const score=t=>{t=t.toLowerCase();return POS.filter(w=>t.includes(w)).length-NEG.filter(w=>t.includes(w)).length};
async function news(){
  try{
    const r=await fetch('https://min-api.cryptocompare.com/data/v2/news/?lang=EN');
    const j=await r.json();
    let sent=0;
    for(const a of j.Data){
      if(sent>=3)break;
      if(S.seen.includes(a.id)||a.published_on*1000<Date.now()-864e5)continue;
      const txt=(a.title+' '+(a.categories||'')).toLowerCase();
      const c=COINS.find(k=>NAMES[k.s].some(w=>new RegExp('\\b'+w+'\\b').test(txt)));
      if(!c)continue;
      S.seen.push(a.id);sent++;
      sen[c.id]=Math.max(-1,Math.min(1,sen[c.id]*.7+score(a.title)*.3));
      say('Bot 2 (News)',c.s+': '+a.title,/^https:/.test(a.url)?a.url:'');
    }
    S.seen=S.seen.slice(-150);
  }catch(e){}
}
function market(){
  const ch=COINS.filter(c=>chg24[c.id]!=null);
  if(!ch.length)return;
  const avg=ch.reduce((a,c)=>a+chg24[c.id],0)/ch.length;
  const w=avg>1?'freundlich':avg<-1?'schwach':'eher seitwärts';
  say('Bot 2 (Marktlage)','Der Markt läuft '+w+': '+ch.map(c=>c.s+' '+pc(chg24[c.id])).join(', ')+' in 24 Stunden.');
}
function bot2(){ // News-Bot: live = echte Nachrichten, sonst Demo
  if(live){
    if(n%150===1)news();
    if(n%300===2)market();
    return;
  }
  if(n%8)return;
  const c=COINS[Math.floor(Math.random()*COINS.length)];
  const d=(Math.random()-.5)*1.2;
  sen[c.id]=Math.max(-1,Math.min(1,sen[c.id]*.6+d));
  const mood=sen[c.id]>.2?'positiv':sen[c.id]<-.2?'negativ':'neutral';
  say('Bot 2 (News, Demo)',c.s+': Stimmung '+mood+'. Das sind simulierte Nachrichten, noch keine echten Quellen.');
}
function bot1(){ // Kerzen-Bot: einfacher Momentum-Test
  const th=live?0.1:0.3;
  COINS.forEach(c=>{
    const h=px[c.id];if(h.length<6)return;
    const ch=(h[h.length-1]/h[h.length-6]-1)*100;
    if(S.pos.some(p=>p.id===c.id)||S.pos.length>=MAXOPEN||S.cash<SIZE)return;
    let dir=0;
    if(ch>th&&sen[c.id]>=0)dir=1;
    if(ch<-th&&sen[c.id]<=0)dir=-1;
    if(!dir)return;
    const e=price[c.id];
    S.cash-=SIZE;
    S.pos.push({id:c.id,dir,entry:e,size:SIZE,sl:e*(1-dir*SL/100),tp:e*(1+dir*TP/100),t:now()});
    say('Bot 1 (Kerzen)',(dir>0?'Long ':'Short ')+c.s+' bei '+pr(e)+' eröffnet (Übung, '+SIZE+' €).');
  });
}
function closeCheck(){
  S.pos=S.pos.filter(p=>{
    const r=p.dir*(price[p.id]/p.entry-1)*100;
    if(r<=-SL||r>=TP){
      const v=val(p);S.cash+=v;
      S.hist.unshift({id:p.id,dir:p.dir,pnl:v-p.size,r});S.hist=S.hist.slice(0,30);
      say('Bot 1 (Kerzen)',sym(p.id)+' geschlossen: '+(v-p.size>=0?'Gewinn ':'Verlust ')+eur(v-p.size)+'.');
      return false;
    }
    return true;
  });
}

function render(){
  const e=equity();eqH.push(e);if(eqH.length>60)eqH.shift();
  const d=e-START;
  $('eq').textContent=eur(e);
  $('pl').className=d>=0?'up':'down';
  $('pl').textContent=(d>=0?'+':'')+eur(d)+' seit Start';
  const lo=Math.min(...eqH),hi=Math.max(...eqH),rg=(hi-lo)||1;
  const pts=eqH.map((v,i)=>(i/Math.max(eqH.length-1,1)*300).toFixed(1)+','+(46-(v-lo)/rg*42).toFixed(1)).join(' ');
  $('spark').innerHTML='<polyline fill="none" stroke="'+(d>=0?'var(--up)':'var(--down)')+'" stroke-width="2" points="'+pts+'"/>';
  $('prices').innerHTML=COINS.map(c=>{
    const h=px[c.id],ch=(h[h.length-1]/h[0]-1)*100;
    return '<div class="row"><b>'+c.s+'</b><span>'+pr(price[c.id])+'</span><span class="'+(ch>=0?'up':'down')+'">'+pc(ch)+'</span></div>';
  }).join('');
  $('src').textContent=live?'Live-Kurse von CoinGecko':'Demo-Kurse (simuliert), echte Kurse laufen nur, wenn die Datei auf deinem Gerät oder einer eigenen Seite geöffnet wird';
  const bots=[
    {n:'Bot 1: Kerzen',t:'Sucht Long- und Short-Chancen im Kursverlauf (BTC, ETH, SOL, XRP)',on:running},
    {n:'Bot 2: News',t:live?'Liest echte Krypto-Nachrichten, meldet die Marktlage und gibt Bot 1 Hinweise':'Bewertet die Stimmung und gibt Bot 1 Hinweise (noch Demo)',on:running}
  ].concat(S.bots.map(b=>({n:esc(b),t:'Wartet auf seine Aufgabe, die legen wir als Nächstes fest',on:false})));
  $('bots').innerHTML=bots.map(b=>'<div class="row"><div><b><span class="dot'+(b.on?' on':'')+'"></span>'+b.n+'</b><div class="sub">'+b.t+'</div></div></div>').join('');
  $('open').innerHTML=S.pos.length?S.pos.map(p=>{
    const r=p.dir*(price[p.id]/p.entry-1)*100;
    return '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b>'+sym(p.id)+' <span class="pill '+(p.dir>0?'long':'short')+'">'+(p.dir>0?'Long':'Short')+'</span></b><span class="'+(r>=0?'up':'down')+'">'+pc(r)+'</span></div>'+
    '<div class="lv"><div><small>Einstieg</small>'+pr(p.entry)+'</div><div><small>Stop-Loss</small><span class="down">'+pr(p.sl)+'</span></div><div><small>Take-Profit</small><span class="up">'+pr(p.tp)+'</span></div></div></div>';
  }).join(''):'<div class="empty">Keine offene Position. Starte die Bots, dann suchen sie nach Chancen.</div>';
  $('closed').innerHTML=S.hist.length?S.hist.map(h=>'<div class="row"><span><b>'+sym(h.id)+'</b> '+(h.dir>0?'Long':'Short')+'</span><span class="'+(h.pnl>=0?'up':'down')+'">'+(h.pnl>=0?'+':'')+eur(h.pnl)+'</span></div>').join(''):'<div class="empty">Noch nichts abgeschlossen.</div>';
  $('msgs').innerHTML=S.msgs.length?S.msgs.map(m=>'<div class="row" style="display:block"><div class="sub">'+m.t+' Uhr, '+m.title+'</div>'+esc(m.text)+(m.u?' <a href="'+esc(m.u)+'" target="_blank" rel="noopener" style="color:var(--acc)">Artikel</a>':'')+'</div>').join(''):'<div class="empty">Noch keine Mitteilungen. Die Bots melden sich hier, sobald etwas passiert.</div>';
  $('bd').hidden=!unread;$('bd').textContent=unread;
  $('run').textContent=running?'Bots pausieren':'Bots starten';
  $('reset').textContent=resetArm?'Wirklich alles zurücksetzen?':'Zurücksetzen';
}

async function tick(){
  n++;
  if(live){if(n%5===0)live=await fetchLive();}else walk();
  if(running){bot2();closeCheck();bot1();}
  save();render();
}

$('run').onclick=()=>{running=!running;if(running&&live){market();news()}say('System',running?'Bots gestartet.':'Bots pausiert.');render()};
$('addb').onclick=()=>{const v=$('nb').value.trim();if(!v)return;S.bots.push(v);$('nb').value='';say('System','Neuer Bot „'+v+'“ angelegt.');save();render()};
$('reset').onclick=()=>{
  if(!resetArm){resetArm=true;setTimeout(()=>{resetArm=false;render()},4000);return render()}
  S=fresh();resetArm=false;unread=0;eqH.length=0;save();render();
};
$('tabs').onclick=ev=>{
  const b=ev.target.closest('button');if(!b)return;
  tab=b.dataset.v;
  ['v1','v2','v3'].forEach(v=>$(v).hidden=v!==tab);
  [...$('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.v===tab));
  if(tab==='v3')unread=0;
  render();
};

(async()=>{live=await fetchLive();render();setInterval(tick,2000)})();
</script>
</body>
</html>
